name: Manual macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      SENTRY_BACKEND: none
      IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'amd64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
          cache-key: flutter-macos-${{ matrix.arch }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Build
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart macos --arch ${{ matrix.arch }}

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          archive: false
